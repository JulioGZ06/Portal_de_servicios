<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Cálculos precisos</title>
  <desc id="desc">Ilustración de una calculadora, gráficas y monedas sobre un fondo verde azulado.</desc>
  <defs>
