<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Portal de servicios{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}">
    {% block page_styles %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
</head>
<body>
    <header class="site-header">
        <nav class="navbar" aria-label="Navegación principal">
            <a class="navbar-brand" href="{{ url_for('inicio') }}">
                <span class="brand-mark" aria-hidden="true">P</span>
                <span>Portal<span class="brand-light"> de servicios</span></span>
            </a>
            <ul class="navbar-links">
                <li><a href="{{ url_for('inicio') }}"{% if request.endpoint == 'inicio' %} aria-current="page"{% endif %}>Inicio</a></li>
                <li><a href="{{ url_for('empresa') }}"{% if request.endpoint == 'empresa' %} aria-current="page"{% endif %}>Empresa</a></li>
                <li><a href="{{ url_for('servicios') }}"{% if request.endpoint == 'servicios' %} aria-current="page"{% endif %}>Servicios</a></li>
                <li><a href="{{ url_for('contacto') }}"{% if request.endpoint == 'contacto' %} aria-current="page"{% endif %}>Contacto</a></li>
                <li><a href="{{ url_for('compra') }}"{% if request.endpoint == 'compra' %} aria-current="page"{% endif %}>Compra</a></li>
                <li><a href="{{ url_for('salario') }}"{% if request.endpoint == 'salario' %} aria-current="page"{% endif %}>Salario</a></li>
                <li><a href="{{ url_for('temperatura') }}"{% if request.endpoint == 'temperatura' %} aria-current="page"{% endif %}>Temperatura</a></li>
            </ul>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="footer-inner">
            <span class="footer-brand">Portal de servicios</span>
            <span>Herramientas claras para el trabajo diario.</span>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
