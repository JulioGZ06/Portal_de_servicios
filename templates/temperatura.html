{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">Conversor de Temperatura</h2>
<div class="row">
    <div class="col-md-6">
        <form method="POST" class="card p-4 shadow-sm">
            <div class="mb-3">
                <label for="celsius" class="form-label">Temperatura en grados Celsius (°C)</label>
                <input type="number" step="0.01" class="form-control" id="celsius" name="celsius" required>
            </div>
            <button type="submit" class="btn btn-primary">Convertir Temperatura</button>
        </form>
    </div>

    {% if resultado %}
    <div class="col-md-6">
        <div class="card border-success shadow-sm">
            <div class="card-header bg-success text-white fw-bold">Resultados de Conversión</div>
            <div class="card-body">
                <p><strong>Dato capturado:</strong> {{ resultado.celsius }} °C</p>
                <hr>
                <p class="fs-5"><strong>Fahrenheit:</strong> {{ resultado.fahrenheit }} °F</p>
                <p class="fs-5"><strong>Kelvin:</strong> {{ resultado.kelvin }} K</p>
            </div>
        </div>
    </div>
    {% endif %}
</div>
{% endblock %}
